name: Bourgogne-Franche-Comte v0.3 Research

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfc-v03-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialization:
    name: BFC v0.3 research invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Test Bourgogne-Franche-Comte v0.3 initialization
        run: python tests/test_bourgogne_franche_comte_v03_initialization.py
      - name: Test Bourgogne-Franche-Comte v0.3 second-source candidate
        run: python tests/test_bfc_v03_second_source_validation.py
