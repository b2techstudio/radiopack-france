name: Bourgogne-Franche-Comte v0.3 Research

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bfc-v03-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialization:
    name: BFC v0.3 research and release invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test Bourgogne-Franche-Comte v0.3 initialization
        run: python tests/test_bourgogne_franche_comte_v03_initialization.py
      - name: Test Bourgogne-Franche-Comte v0.3 second-source candidate
        run: python tests/test_bfc_v03_second_source_validation.py
      - name: Test Bourgogne-Franche-Comte v0.3 AIRAC 08 aviation
        run: python tests/test_bfc_v03_aviation_airac08.py
      - name: Test Bourgogne-Franche-Comte v0.3 prepublication
        run: python tests/test_bfc_v03_prepublication.py
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: cd website && npm ci
      - name: Build Astro website
        run: cd website && npm run build
      - name: Validate built Bourgogne-Franche-Comte v0.3 CSV and print SHA-256
        run: python tests/test_bfc_v03_built_csv.py --dist website/dist
