name: Auvergne-Rhone-Alpes v0.3 Inland VHF

on:
  push:
    branches:
      - main
    paths:
      - "data/regional/auvergne-rhone-alpes-inland-vhf-rx.json"
      - "research/auvergne-rhone-alpes-v0.3/**"
      - "research/auvergne-rhone-alpes-v0.2/publication-record.json"
      - "tools/build_ara_v03_candidate.py"
      - "tests/test_ara_v03_candidate.py"
      - ".github/workflows/ara-v03-inland-vhf.yml"
  pull_request:
    branches:
      - main
    paths:
      - "data/regional/auvergne-rhone-alpes-inland-vhf-rx.json"
      - "research/auvergne-rhone-alpes-v0.3/**"
      - "research/auvergne-rhone-alpes-v0.2/publication-record.json"
      - "tools/build_ara_v03_candidate.py"
      - "tests/test_ara_v03_candidate.py"
      - ".github/workflows/ara-v03-inland-vhf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ara-v03-inland-vhf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  internal-candidate:
    name: ARA v0.3 internal candidate invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: cd website && npm ci

      - name: Build Astro website and immutable ARA v0.2 route
        run: cd website && npm run build

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build ARA v0.3 internal candidate
        run: python tools/build_ara_v03_candidate.py --write

      - name: Rebuild and compare ARA v0.3 internal candidate
        run: python tools/build_ara_v03_candidate.py --check

      - name: Test ARA v0.3 inland-VHF invariants
        run: python tests/test_ara_v03_candidate.py --dist website/dist
