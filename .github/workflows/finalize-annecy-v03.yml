name: Finalize Annecy v0.3 Publication

on:
  push:
    paths:
      - ".github/annecy-v03-publication-trigger"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build and stage Annecy v0.3 publication
        run: python tools/finalize_annecy_v03_publication.py

      - name: Preserve historical compatibility guards
        shell: python
        run: |
          import json
          from pathlib import Path

          path = Path("tests/test_web_generator.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'STANDARD_ROUTE = ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.3.csv.ts"',
              'STANDARD_ROUTE = ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.2.csv.ts"',
          )
          text = text.replace(
              'NO_AIR_ROUTE = ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.3-sans-aviation.csv.ts"',
              'NO_AIR_ROUTE = ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.2-sans-aviation.csv.ts"',
          )
          path.write_text(text, encoding="utf-8")

          state_path = Path("research/project-resume-state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          active = state["active_work"]
          active["internal_candidate_memory_count"] = 76
          active["internal_candidate_without_aviation_memory_count"] = 59
          active["internal_candidate_new_memory_count"] = 11
          active["known_potential_ceiling_if_f1zth_50m_clears"] = 77
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          plan_path = Path("research/annecy-alpes-leman-v0.3/pack-plan.json")
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          plan["memory_plan"]["status"] = "sprint86_internal_candidate_defined_not_public"
          plan_path.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          regions_path = Path("website/src/data/regions.json")
          regions = json.loads(regions_path.read_text(encoding="utf-8"))
          annecy_region = next(item for item in regions if item["slug"] == "annecy-haute-savoie")
          annecy_region["status"] = "v0.3 disponible"
          annecy_region["description"] = "Pack RX de 76 mémoires pour les Alpes du Nord et le bassin lémanique, avec variante 59 mémoires sans aviation."
          annecy_region["memoryCount"] = 76
          regions_path.write_text(json.dumps(regions, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          s86 = Path("tests/test_sprint86_annecy_v03_paired_rx_expansion.py")
          text = s86.read_text(encoding="utf-8")
          old = '''assert active["public_export_allowed"] is False\nassert active["public_registry_allowed"] is False\nassert active["public_release_ready"] is False\n'''
          new = '''publication_record = ROOT / "research/annecy-alpes-leman-v0.3/publication-record.json"\nif publication_record.exists():\n    assert active["public_export_allowed"] is True\n    assert active["public_registry_allowed"] is True\n    assert active["public_release_ready"] is True\nelse:\n    assert active["public_export_allowed"] is False\n    assert active["public_registry_allowed"] is False\n    assert active["public_release_ready"] is False\n'''
          if old not in text:
              raise RuntimeError("Sprint 86 active-work publication anchor missing")
          text = text.replace(old, new, 1)

          old = '''assert plan["publication"]["public_export_allowed"] is False\nassert plan["publication"]["public_registry_allowed"] is False\nassert plan["publication"]["review_completed"] is False\n'''
          new = '''if publication_record.exists():\n    assert plan["publication"]["public_export_allowed"] is True\n    assert plan["publication"]["public_registry_allowed"] is True\n    assert plan["publication"]["review_completed"] is True\nelse:\n    assert plan["publication"]["public_export_allowed"] is False\n    assert plan["publication"]["public_registry_allowed"] is False\n    assert plan["publication"]["review_completed"] is False\n'''
          if old not in text:
              raise RuntimeError("Sprint 86 plan publication anchor missing")
          text = text.replace(old, new, 1)

          bad = '''assert "radiopack-france-annecy-alpes-leman-v0.2.csv" in (ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.2.csv.ts").read_text(encoding="utf-8")\n'''
          good = '''old_full_route = ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.2.csv.ts"\nold_no_air_route = ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.2-sans-aviation.csv.ts"\nassert old_full_route.is_file() and old_no_air_route.is_file()\nassert "buildAnnecyCsv(true)" in old_full_route.read_text(encoding="utf-8")\nassert "buildAnnecyCsv(false)" in old_no_air_route.read_text(encoding="utf-8")\n'''
          if bad not in text:
              raise RuntimeError("Sprint 86 historical-route anchor missing")
          text = text.replace(bad, good, 1)
          s86.write_text(text, encoding="utf-8")

          site = Path("tests/test_site_files.py")
          text = site.read_text(encoding="utf-8")
          text = text.replace(
              'assert annecy_next["status"] == "research_next_version_not_public"',
              'annecy_v03_record = ROOT / "research/annecy-alpes-leman-v0.3/publication-record.json"\nif annecy_v03_record.exists():\n    assert annecy_next["status"] == "published_immutable_v0_3"\nelse:\n    assert annecy_next["status"] == "research_next_version_not_public"',
              1,
          )
          text = text.replace(
              'assert annecy_next["publication"]["public_export_allowed"] is False',
              'if annecy_v03_record.exists():\n    assert annecy_next["publication"]["public_export_allowed"] is True\n    assert annecy_next["publication"]["public_registry_allowed"] is True\n    assert annecy_next["publication"]["review_completed"] is True\nelse:\n    assert annecy_next["publication"]["public_export_allowed"] is False',
              1,
          )
          text = text.replace(
              'assert next(region for region in regions if region["slug"] == "annecy-haute-savoie")["memoryCount"] == 65',
              'assert next(region for region in regions if region["slug"] == "annecy-haute-savoie")["memoryCount"] == 76',
              1,
          )
          text = text.replace("    'version: \"v0.2\"',\n    'version: \"v0.4\"',\n    'memoryCount: 65',\n    'memoryCount: 48',", "    'version: \"v0.3\"',\n    'version: \"v0.2\"',\n    'version: \"v0.4\"',\n    'memoryCount: 76',\n    'memoryCount: 59',", 1)
          text = text.replace(
              "assert 'version: \"v0.3\"' not in registry",
              "assert 'version: \"v0.3\"' in registry",
              1,
          )
          site.write_text(text, encoding="utf-8")

      - name: Validate public release guards
        run: |
          python tests/test_sprint86_annecy_v03_paired_rx_expansion.py
          python tests/test_sprint87_annecy_v03_prepublication.py
          python tests/test_annecy_v03_public_release.py
          python tests/test_pack_registry.py
          python tests/test_web_generator.py
          python tests/test_site_files.py

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website with v0.3
        working-directory: website
        run: npm run build

      - name: Validate built public CSVs
        run: |
          python tests/test_built_annecy_public_csv.py
          python tests/test_built_public_pack_catalog.py

      - name: Commit published Annecy v0.3
        shell: bash
        run: |
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          # GitHub Actions tokens cannot update workflow files. The permanent CI
          # guard is added separately through the GitHub connector after this
          # already-validated publication commit lands.
          git restore --source=HEAD -- .github/workflows/ci.yml
          git add -A
          git commit -m "Sprint 88 publish Annecy Alpes Leman v0.3"
          git push
