name: Sprint 104 State Sync

on:
  push:
    branches:
      - main
    paths:
      - "research/project-resume-state.json"
      - "research/sprint-104-summary.md"
      - "research/grand-est-v0.4/publication-record.json"
      - "website/src/lib/packRegistry.ts"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "tests/test_sprint104_state_sync.py"
      - ".github/workflows/sprint-104-state-sync.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/project-resume-state.json"
      - "research/sprint-104-summary.md"
      - "research/grand-est-v0.4/publication-record.json"
      - "website/src/lib/packRegistry.ts"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "tests/test_sprint104_state_sync.py"
      - ".github/workflows/sprint-104-state-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Verify Sprint 104 state synchronization
        run: python tests/test_sprint104_state_sync.py
