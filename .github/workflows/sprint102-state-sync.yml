name: Sprint 102 State Sync

on:
  push:
    branches:
      - main
    paths:
      - "research/project-resume-state.json"
      - "research/grand-est-v0.3/**"
      - "website/public/downloads/grand-est/**"
      - "website/src/lib/packRegistry.ts"
      - "tests/test_sprint102_state_sync.py"
      - ".github/workflows/sprint102-state-sync.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/project-resume-state.json"
      - "research/grand-est-v0.3/**"
      - "website/public/downloads/grand-est/**"
      - "website/src/lib/packRegistry.ts"
      - "tests/test_sprint102_state_sync.py"
      - ".github/workflows/sprint102-state-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state-sync:
    name: Sprint 102 state synchronization
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test Sprint 102 state synchronization
        run: python tests/test_sprint102_state_sync.py
