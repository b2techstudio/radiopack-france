name: Sprint 109 State Sync

on:
  push:
    branches:
      - main
    paths:
      - "research/project-resume-state.json"
      - "research/auvergne-rhone-alpes-v0.2/publication-record.json"
      - "research/auvergne-rhone-alpes-v0.3/**"
      - "research/sprint-108-summary.md"
      - "research/sprint-109-summary.md"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "website/src/lib/packRegistry.ts"
      - "website/src/data/regions.json"
      - "tests/test_site_files.py"
      - "tests/test_sprint109_state_sync.py"
      - ".github/workflows/sprint109-state-sync.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/project-resume-state.json"
      - "research/auvergne-rhone-alpes-v0.2/publication-record.json"
      - "research/auvergne-rhone-alpes-v0.3/**"
      - "research/sprint-108-summary.md"
      - "research/sprint-109-summary.md"
      - "README.md"
      - "PROJECT_STATUS.md"
      - "website/src/lib/packRegistry.ts"
      - "website/src/data/regions.json"
      - "tests/test_site_files.py"
      - "tests/test_sprint109_state_sync.py"
      - ".github/workflows/sprint109-state-sync.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint109-state-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state-sync:
    name: Sprint 109 canonical state synchronization
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Verify Sprint 109 canonical state
        run: python tests/test_sprint109_state_sync.py

      - name: Verify repository/site synchronization
        run: python tests/test_site_files.py
