name: Finalize Sprint 86

on:
  push:
    paths:
      - ".github/sprint86-finalize-trigger"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Finalize Sprint 86
        run: |
          python tools/finalize_sprint86.py
          python - <<'PY'
          import json
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          if "147 mémoires" not in text:
              anchor = "\n\nPoint de reprise :"
              note = "\n\nRepère Normandie v0.5 : le plafond potentiel reste **147 mémoires** hors F6ZES ; le candidat reste à 142 tant que les gates terrain et sources ne sont pas franchis."
              if anchor not in text:
                  raise SystemExit("README point de reprise anchor missing")
              text = text.replace(anchor, note + anchor, 1)
              readme.write_text(text, encoding="utf-8")

          plan_path = Path("research/annecy-alpes-leman-v0.3/pack-plan.json")
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          plan["schema_version"] = "1.1"
          plan_path.write_text(json.dumps(plan, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate Sprint 86 candidate
        run: |
          python tests/test_sprint86_annecy_v03_paired_rx_expansion.py
          python tests/test_site_files.py

      - name: Commit final state
        shell: bash
        run: |
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git add README.md PROJECT_STATUS.md CHANGELOG.md research/project-resume-state.json research/annecy-alpes-leman-v0.3/README.md research/annecy-alpes-leman-v0.3/pack-plan.json tests/test_site_files.py
          git commit -m "Sprint 86 finalize Annecy v0.3 paired RX candidate"
          git push
