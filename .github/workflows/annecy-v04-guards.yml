name: Annecy v0.4 Guards

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: annecy-v04-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  annecy-v04-release:
    name: Annecy v0.4 release invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Test frozen Annecy v0.4 prepublication inputs
        run: python tests/test_sprint94_annecy_v04_prepublication.py
      - name: Test immutable Annecy v0.4 public release
        run: python tests/test_annecy_v04_public_release.py

  sprint98-sync:
    name: One-shot Sprint 98 branch sync
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/sprint-98-metropolitan-consolidation' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout PR head branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Generate Sprint 98 official state without workflow mutation
        run: |
          python tools/prepare_sprint98_nonworkflow.py
          python tools/apply_sprint98_state.py
      - name: Commit synchronized state to PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate official Sprint 98 state"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"
