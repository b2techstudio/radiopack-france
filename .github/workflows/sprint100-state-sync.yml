name: Sprint 100 State Sync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint100-state-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state-sync:
    name: Official state 100 / 0.21.89
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Test Sprint 100 official state synchronization
        run: python tests/test_sprint100_state_sync.py
