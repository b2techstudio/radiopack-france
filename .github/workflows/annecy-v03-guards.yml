name: Annecy v0.3 Release Guards

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annecy-v03:
    name: Annecy v0.3 immutable release guards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test Sprint 87 Annecy v0.3 prepublication
        run: python tests/test_sprint87_annecy_v03_prepublication.py

      - name: Test Annecy v0.3 public release
        run: python tests/test_annecy_v03_public_release.py
