name: Full data test diagnosis

on:
  push:
    branches:
      - annecy-v04-publication

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Run every data-job test and report all failures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import sys

          workflow = Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          data_section = workflow.split('\n  website:\n', 1)[0]
          tests = re.findall(r'run: python (tests/[^\s]+\.py)', data_section)
          failures = []
          for test in tests:
              print(f'\n===== {test} =====', flush=True)
              result = subprocess.run([sys.executable, test], text=True, capture_output=True)
              if result.stdout:
                  print(result.stdout, end='')
              if result.stderr:
                  print(result.stderr, end='', file=sys.stderr)
              if result.returncode:
                  failures.append(test)
                  print(f'FAILED: {test} (exit {result.returncode})', file=sys.stderr)
          print('\n===== SUMMARY =====')
          if failures:
              print('FAILED TESTS:')
              for test in failures:
                  print(test)
              raise SystemExit(1)
          print(f'ALL {len(tests)} DATA TESTS PASSED')
          PY
