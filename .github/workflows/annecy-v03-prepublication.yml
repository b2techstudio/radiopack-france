name: Annecy v0.3 Prepublication Validation

on:
  push:
    paths:
      - ".github/annecy-v03-prepublication-trigger"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test Sprint 87 Annecy v0.3 prepublication
        run: python tests/test_sprint87_annecy_v03_prepublication.py
