name: Centre-Val de Loire v0.3 Research

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: centre-v03-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Centre v0.3 research and release invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Test Centre-Val de Loire v0.3 release scope
        run: python tests/test_centre_v03_release.py
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: cd website && npm ci
      - name: Build Astro website
        run: cd website && npm run build
      - name: Validate built Centre-Val de Loire v0.3 CSV and print SHA-256
        run: python tests/test_centre_v03_built_csv.py --dist website/dist
