name: Update Annecy v0.4 Current Site Assertions

on:
  push:
    branches:
      - annecy-v04-publication

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Update current public registry assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_site_files.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('assert next(region for region in regions if region["slug"] == "annecy-haute-savoie")["memoryCount"] == 76',
               'assert next(region for region in regions if region["slug"] == "annecy-haute-savoie")["memoryCount"] == 77'),
              ('    \'memoryCount: 76\',', '    \'memoryCount: 77\','),
              ('    \'memoryCount: 59\',', '    \'memoryCount: 60\','),
              ('assert \'version: "v0.3"\' in registry',
               'assert \'/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.4.csv\' in registry\nassert \'/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.4-sans-aviation.csv\' in registry'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected current-site assertion not found: {old}')
              text = text.replace(old, new, 1)
          old = '    \'version: "v0.3"\',\n'
          if old not in text:
              raise SystemExit('expected obsolete v0.3 registry list assertion not found')
          text = text.replace(old, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit updated current-site assertions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git add tests/test_site_files.py
          git commit -m "Keep current site assertions aligned with Annecy v0.4"
          git push origin HEAD:annecy-v04-publication
