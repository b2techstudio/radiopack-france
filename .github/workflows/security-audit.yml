name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: radiopack-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-security:
    name: Repository security invariants
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Run deterministic security checks
        run: python tests/test_security_hardening.py

      - name: Compile Python sources
        run: python -m compileall -q generator tools tests

      - name: Install Python dependency auditor
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1"

      - name: Audit Python generator dependencies
        run: python -m pip_audit -r requirements-generator.txt --strict

  website-security:
    name: Website dependency and production security
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit all npm dependencies
        run: npm audit --audit-level=low

      - name: Build production site
        run: npm run build

      - name: Reject source maps in production output
        shell: bash
        run: |
          if find dist -type f -name '*.map' -print -quit | grep -q .; then
            echo "Unexpected source map in production output" >&2
            exit 1
          fi

      - name: Verify Cloudflare hardening files reach production output
        shell: bash
        run: |
          test -f dist/_headers
          test -f dist/_redirects
          grep -F "Content-Security-Policy:" dist/_headers
          grep -F "Strict-Transport-Security: max-age=31536000" dist/_headers

  live-pages-security:
    name: Live Cloudflare Pages response security
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - website-security
    runs-on: ubuntu-24.04

    steps:
      - name: Verify deployed Pages origin security headers
        shell: bash
        run: |
          set -euo pipefail
          url="https://radiopack-france.pages.dev/"
          headers="$(mktemp)"
          body="$(mktemp)"
          ok=0

          for attempt in $(seq 1 18); do
            : > "$headers"
            : > "$body"
            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              --dump-header "$headers" --output "$body" "$url"; then
              if grep -Eiq '^content-security-policy: .*default-src .self.' "$headers" \
                && grep -Eiq '^strict-transport-security: max-age=31536000' "$headers" \
                && grep -Eiq '^x-frame-options: DENY' "$headers" \
                && grep -Eiq '^x-content-type-options: nosniff' "$headers"; then
                ok=1
                break
              fi
            fi
            echo "Live Pages hardening not visible yet (attempt ${attempt}/18)"
            sleep 10
          done

          if [[ "$ok" -ne 1 ]]; then
            echo "Deployed Pages origin did not expose the required security headers" >&2
            cat "$headers" >&2
            exit 1
          fi

          grep -Eiq '^cross-origin-opener-policy: same-origin' "$headers"
          grep -Eiq '^referrer-policy: strict-origin-when-cross-origin' "$headers"
          grep -Eiq '^permissions-policy:' "$headers"
          grep -Eiq '^content-type: text/html' "$headers"
          test -s "$body"
          echo "Live Cloudflare Pages security headers verified"

  custom-domain-state:
    name: Custom domain DNS state
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04

    steps:
      - name: Report custom-domain reachability
        shell: bash
        run: |
          set -euo pipefail
          host="radiopack.b2tech.studio"
          url="https://${host}/"

          if ! getent ahosts "$host" >/dev/null 2>&1; then
            echo "::warning title=Custom domain DNS pending::${host} does not currently resolve publicly. The deployed Pages origin is audited independently."
            exit 0
          fi

          headers="$(mktemp)"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 20 \
            --dump-header "$headers" --output /dev/null "$url"
          grep -Eiq '^content-security-policy: .*default-src .self.' "$headers"
          grep -Eiq '^strict-transport-security: max-age=31536000' "$headers"
          grep -Eiq '^x-frame-options: DENY' "$headers"
          grep -Eiq '^x-content-type-options: nosniff' "$headers"
          echo "Custom domain resolves and exposes the required security headers"
