name: Finalize Sprint 77

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[finalize-sprint77]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Finalize project state and docs
        run: python tools/finalize_sprint77.py

      - name: Commit finalized Sprint 77 state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sprint 77 finalize project state and documentation [reference-archive]"
          git push origin HEAD:main
