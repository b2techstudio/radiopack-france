name: Grand Est v0.4 Inland VHF

on:
  push:
    branches:
      - main
    paths:
      - "data/regional/grand-est-inland-vhf-rx.json"
      - "research/grand-est-v0.4/**"
      - "research/sprint-103-inland-vhf-audit.json"
      - "research/sprint-103-summary.md"
      - "tools/build_grand_est_v04_candidate.py"
      - "tests/test_grand_est_v04_candidate.py"
      - ".github/workflows/grand-est-v04-inland-vhf.yml"
  pull_request:
    branches:
      - main
    paths:
      - "data/regional/grand-est-inland-vhf-rx.json"
      - "research/grand-est-v0.4/**"
      - "research/sprint-103-inland-vhf-audit.json"
      - "research/sprint-103-summary.md"
      - "tools/build_grand_est_v04_candidate.py"
      - "tests/test_grand_est_v04_candidate.py"
      - ".github/workflows/grand-est-v04-inland-vhf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-est-v04-inland-vhf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build candidate in workspace
        run: python tools/build_grand_est_v04_candidate.py --write
      - name: Verify frozen workspace candidate
        run: python tools/build_grand_est_v04_candidate.py --check
      - name: Test Grand Est v0.4 inland VHF candidate
        run: python tests/test_grand_est_v04_candidate.py
      - name: Show candidate manifest
        run: cat research/grand-est-v0.4/generated/release-candidate/candidate-manifest.json
