name: Finalize Annecy v0.3 Publication

on:
  push:
    paths:
      - ".github/annecy-v03-publication-trigger"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build and stage Annecy v0.3 publication
        run: python tools/finalize_annecy_v03_publication.py

      - name: Preserve historical compatibility guards
        shell: python
        run: |
          import json
          from pathlib import Path

          # The old v0.2 dynamic routes remain historical and must stay tested.
          path = Path("tests/test_web_generator.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              'STANDARD_ROUTE = ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.3.csv.ts"',
              'STANDARD_ROUTE = ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.2.csv.ts"',
          )
          text = text.replace(
              'NO_AIR_ROUTE = ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.3-sans-aviation.csv.ts"',
              'NO_AIR_ROUTE = ROOT / "website/src/pages/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.2-sans-aviation.csv.ts"',
          )
          path.write_text(text, encoding="utf-8")

          # Keep the Sprint 86 candidate fields in the final machine state for historical guards.
          state_path = Path("research/project-resume-state.json")
          state = json.loads(state_path.read_text(encoding="utf-8"))
          active = state["active_work"]
          active["internal_candidate_memory_count"] = 76
          active["internal_candidate_without_aviation_memory_count"] = 59
          active["internal_candidate_new_memory_count"] = 11
          active["known_potential_ceiling_if_f1zth_50m_clears"] = 77
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          # Sprint 86 remains a candidate-history test; after explicit publication only the public flags change.
          s86 = Path("tests/test_sprint86_annecy_v03_paired_rx_expansion.py")
          text = s86.read_text(encoding="utf-8")
          old = '''assert active["public_export_allowed"] is False\nassert active["public_registry_allowed"] is False\nassert active["public_release_ready"] is False\n'''
          new = '''publication_record = ROOT / "research/annecy-alpes-leman-v0.3/publication-record.json"\nif publication_record.exists():\n    assert active["public_export_allowed"] is True\n    assert active["public_registry_allowed"] is True\n    assert active["public_release_ready"] is True\nelse:\n    assert active["public_export_allowed"] is False\n    assert active["public_registry_allowed"] is False\n    assert active["public_release_ready"] is False\n'''
          if old not in text:
              raise RuntimeError("Sprint 86 active-work publication anchor missing")
          text = text.replace(old, new, 1)

          old = '''assert plan["publication"]["public_export_allowed"] is False\nassert plan["publication"]["public_registry_allowed"] is False\nassert plan["publication"]["review_completed"] is False\n'''
          new = '''if publication_record.exists():\n    assert plan["publication"]["public_export_allowed"] is True\n    assert plan["publication"]["public_registry_allowed"] is True\n    assert plan["publication"]["review_completed"] is True\nelse:\n    assert plan["publication"]["public_export_allowed"] is False\n    assert plan["publication"]["public_registry_allowed"] is False\n    assert plan["publication"]["review_completed"] is False\n'''
          if old not in text:
              raise RuntimeError("Sprint 86 plan publication anchor missing")
          s86.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Validate public release guards
        run: |
          python tests/test_sprint86_annecy_v03_paired_rx_expansion.py
          python tests/test_sprint87_annecy_v03_prepublication.py
          python tests/test_annecy_v03_public_release.py
          python tests/test_pack_registry.py
          python tests/test_web_generator.py
          python tests/test_site_files.py

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website with v0.3
        working-directory: website
        run: npm run build

      - name: Validate built public CSVs
        run: |
          python tests/test_built_annecy_public_csv.py
          python tests/test_built_public_pack_catalog.py

      - name: Commit published Annecy v0.3
        shell: bash
        run: |
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git add -A
          git commit -m "Sprint 88 publish Annecy Alpes Leman v0.3"
          git push
