name: Sprint 105 Finalize Docs

on:
  push:
    branches:
      - feature/sprint-105-idf-v04-inland-vhf

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/sprint-105-idf-v04-inland-vhf
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Finalize documentation
        run: python tools/finalize_sprint105_docs.py
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No documentation changes"
          else
            git commit -m "Sprint 105: synchronize documentation"
            git push origin HEAD:feature/sprint-105-idf-v04-inland-vhf
          fi
