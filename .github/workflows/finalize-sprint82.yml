name: Finalize Sprint 82

on:
  push:
    paths:
      - ".github/sprint82-finalize-trigger"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Finalize Sprint 82
        run: python tools/finalize_sprint82.py

      - name: Commit final state
        shell: bash
        run: |
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git add README.md PROJECT_STATUS.md CHANGELOG.md research/project-resume-state.json research/bretagne-v0.3/README.md tests/test_site_files.py
          git commit -m "Sprint 82 finalize Bretagne v0.3 public revalidation"
          git push
