name: Finalize Sprint 79

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ contains(github.event.head_commit.message, '[finalize-sprint79]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Finalize Sprint 79 state and documentation
        run: python tools/finalize_sprint79.py

      - name: Commit finalized Sprint 79 state
        shell: bash
        run: |
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git checkout -- .github/workflows/ci.yml .github/workflows/finalize-sprint79.yml
          git add -A
          git commit -m "Sprint 79 finalize project state and documentation [reference-archive]"
          git push origin HEAD:main
