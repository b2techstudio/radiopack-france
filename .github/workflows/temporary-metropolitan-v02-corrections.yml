name: Temporary metropolitan v0.2 corrections

on:
  push:
    branches:
      - feature/enrich-metropolitan-regions-v02

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-v02-corrections]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Apply reviewed corrections
        run: python tools/apply_metropolitan_v02_corrections.py
      - name: Commit reviewed corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Correct v0.2 aviation data and synchronize documentation"
          git push
