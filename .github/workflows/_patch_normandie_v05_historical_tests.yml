name: Patch historical Normandie v0.5 guards

on:
  push:
    branches:
      - release/normandie-v05-theoretical
    paths:
      - ".github/workflows/_patch_normandie_v05_historical_tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: release/normandie-v05-theoretical

      - name: Patch Sprint 85 historical guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_sprint85_normandie_v05_field_evaluator.py')
          text = path.read_text(encoding='utf-8')
          old = '''assert not (ROOT / "website/public/downloads/normandie/radiopack-france-normandie-v0.5.csv").exists()\nregistry = (ROOT / "website/src/lib/packRegistry.ts").read_text(encoding="utf-8")\nassert "radiopack-france-normandie-v0.4.csv" in registry\nassert "radiopack-france-normandie-v0.5.csv" not in registry\n\nprint("Sprint 85 Normandie v0.5: field-session evaluator classifies R3/F5ZHA gates reproducibly, ignores diagnostics for promotion, never auto-mutates or publishes OK")\n'''
          new = '''public_v05 = ROOT / "website/public/downloads/normandie/radiopack-france-normandie-v0.5.csv"\nregistry = (ROOT / "website/src/lib/packRegistry.ts").read_text(encoding="utf-8")\n# Sprint 85 remains historical optional field-evaluation tooling. Later theory-based\n# publication does not rewrite its evaluator policy or synthetic session results.\nif public_v05.exists():\n    assert "radiopack-france-normandie-v0.5.csv" in registry\n    assert 'version: "v0.5"' in registry\n    assert 'memoryCount: 146' in registry\nelse:\n    assert "radiopack-france-normandie-v0.4.csv" in registry\n    assert "radiopack-france-normandie-v0.5.csv" not in registry\n\nprint("Sprint 85 historical Normandie field evaluator remains reproducible as optional quality tooling and never auto-mutates or publishes OK")\n'''
          if old not in text:
              raise SystemExit('expected Sprint 85 tail not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/_patch_normandie_v05_historical_tests.yml

      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_sprint85_normandie_v05_field_evaluator.py .github/workflows/_patch_normandie_v05_historical_tests.yml
          git commit -m "Make Sprint 85 field evaluator historical-safe"
          git push origin HEAD:release/normandie-v05-theoretical
