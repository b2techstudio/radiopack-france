name: Sprint 104 Fix Bretagne JSON Guard

on:
  push:
    branches:
      - feature/sprint-104-grand-est-v04-publication
    paths:
      - ".github/workflows/sprint104-fix-bretagne-json-guard.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Replace formatting-dependent assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_bretagne_research_scaffold.py')
          text = path.read_text(encoding='utf-8')
          old = '''registry = (ROOT / "website/src/lib/packRegistry.ts").read_text(encoding="utf-8").lower()\nregions = (ROOT / "website/src/data/regions.json").read_text(encoding="utf-8").lower()\nassert 'id: "bretagne"' in registry\nassert '\"slug\": \"bretagne\"' in regions\n'''
          new = '''registry = (ROOT / "website/src/lib/packRegistry.ts").read_text(encoding="utf-8").lower()\nregions = json.loads((ROOT / "website/src/data/regions.json").read_text(encoding="utf-8"))\nassert 'id: "bretagne"' in registry\nbretagne_region = next(item for item in regions if item["slug"] == "bretagne")\nassert bretagne_region["available"] is True\nassert bretagne_region["status"] == "v0.2 disponible"\n'''
          if old not in text:
              raise SystemExit('Expected brittle block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_bretagne_research_scaffold.py
          git commit -m "Sprint 104: make Bretagne region guard JSON-semantic"
          git push origin HEAD:${GITHUB_REF_NAME}
