name: Grand Est v0.4 Inland VHF

on:
  push:
    branches:
      - main
    paths:
      - "data/national/marine-vhf-rx.json"
      - "data/regional/grand-est-inland-vhf-rx.json"
      - "research/grand-est-v0.4/**"
      - "research/sprint-103-inland-vhf-audit.json"
      - "research/sprint-103-inland-vhf-audit-pass2.json"
      - "research/sprint-103-summary.md"
      - "research/sprint-104-summary.md"
      - "research/project-resume-state.json"
      - "tools/build_grand_est_v04_candidate.py"
      - "tests/test_grand_est_v04_candidate.py"
      - "tests/test_grand_est_v04_publication.py"
      - "tests/test_inland_vhf_existing_coverage.py"
      - "tests/test_sprint103_inland_vhf_audit.py"
      - "tests/test_sprint104_state_sync.py"
      - "website/public/downloads/grand-est/**"
      - "website/src/lib/packRegistry.ts"
      - "website/src/pages/regions/[slug].astro"
      - ".github/workflows/grand-est-v04-inland-vhf.yml"
  pull_request:
    branches:
      - main
    paths:
      - "data/national/marine-vhf-rx.json"
      - "data/regional/grand-est-inland-vhf-rx.json"
      - "research/grand-est-v0.4/**"
      - "research/sprint-103-inland-vhf-audit.json"
      - "research/sprint-103-inland-vhf-audit-pass2.json"
      - "research/sprint-103-summary.md"
      - "research/sprint-104-summary.md"
      - "research/project-resume-state.json"
      - "tools/build_grand_est_v04_candidate.py"
      - "tests/test_grand_est_v04_candidate.py"
      - "tests/test_grand_est_v04_publication.py"
      - "tests/test_inland_vhf_existing_coverage.py"
      - "tests/test_sprint103_inland_vhf_audit.py"
      - "tests/test_sprint104_state_sync.py"
      - "website/public/downloads/grand-est/**"
      - "website/src/lib/packRegistry.ts"
      - "website/src/pages/regions/[slug].astro"
      - ".github/workflows/grand-est-v04-inland-vhf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: grand-est-v04-inland-vhf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: Grand Est v0.4 inland VHF and publication guards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Rebuild publication basis in workspace
        run: python tools/build_grand_est_v04_candidate.py --write
      - name: Verify frozen candidate manifest and public bytes
        run: python tools/build_grand_est_v04_candidate.py --check
      - name: Test Grand Est v0.4 publication basis
        run: python tests/test_grand_est_v04_candidate.py
      - name: Test Grand Est v0.4 publication metadata
        run: python tests/test_grand_est_v04_publication.py
      - name: Verify existing coastal RF coverage
        run: python tests/test_inland_vhf_existing_coverage.py
      - name: Verify national inland VHF audit history
        run: python tests/test_sprint103_inland_vhf_audit.py
      - name: Verify Sprint 104 state synchronization
        run: python tests/test_sprint104_state_sync.py
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install website dependencies
        run: cd website && npm ci
      - name: Build Astro website
        run: cd website && npm run build
      - name: Recheck Grand Est v0.4 after Astro build
        run: python tests/test_grand_est_v04_publication.py
      - name: Show publication manifest
        run: cat research/grand-est-v0.4/generated/release-candidate/candidate-manifest.json
