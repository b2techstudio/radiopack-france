name: Sprint 68 Clean Scope Apply

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.head_commit.message == 'Sprint 68 trigger clean scope closure v2' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Verify and apply clean Sprint 68 patch
        shell: bash
        run: |
          cat research/.s68-clean-0 research/.s68-clean-1 research/.s68-clean-2 research/.s68-clean-3 \
            | base64 --decode | gzip --decompress > /tmp/sprint68.patch
          test "$(wc -c < /tmp/sprint68.patch)" = "59867"
          test "$(sha256sum /tmp/sprint68.patch | awk '{print $1}')" = "97c196d751ecc486690ef0b6c00697b5f8351b8d337f3b54507ebef06d23a834"
          git apply --check /tmp/sprint68.patch
          git apply /tmp/sprint68.patch
          rm -f research/.s68-clean-0 research/.s68-clean-1 research/.s68-clean-2 research/.s68-clean-3 research/.s68-trigger
          python tests/test_sprint68_scope_closure.py
          python tools/run_normandie_v04_prepublication_audit.py --require-prepublication-ready
          python tools/run_normandie_v04_publication_dry_run.py --baseline research/normandie-v0.4/review-baseline.json --require-activation-ready
          git diff --check
          git config user.name "b2techstudio"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Sprint 68 freeze Normandie v0.4 scope at 142"
          git push origin HEAD:main
