name: Temporary Sprint 111 Guard Patch

on:
  push:
    branches:
      - chore/sprint111-state-sync
    paths:
      - "tools/_patch_sprint111_guards.py"
      - ".github/workflows/_sprint111-guard-patch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Patch site guard
        run: python tools/_patch_sprint111_guards.py

      - name: Commit patched guard and remove temporary helpers
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_site_files.py
          git rm tools/_patch_sprint111_guards.py .github/workflows/_sprint111-guard-patch.yml
          git commit -m "Sprint 111: align repository site guard"
          git push origin HEAD:chore/sprint111-state-sync
