name: Sprint 96 State Sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.head_commit.message == 'Run Sprint 96 state sync v2' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Synchronize Sprint 96 project state
        run: python tools/sync_sprint96_state.py

      - name: Validate synchronized state
        run: |
          python -m json.tool research/project-resume-state.json >/dev/null
          grep -q '"current_sprint": 96' research/project-resume-state.json
          grep -q '"state_version": "0.21.85"' research/project-resume-state.json
          grep -q 'Sprint 96 / 0.21.85' README.md
          grep -q 'Sprint courant : \*\*96\*\*' PROJECT_STATUS.md
          grep -q '## 0.21.85 - 2026-08-15' CHANGELOG.md
          test -f research/sprint-96-summary.md
          git diff --exit-code -- website/public/downloads

      - name: Commit synchronized state
        run: |
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git add README.md PROJECT_STATUS.md CHANGELOG.md research/project-resume-state.json research/sprint-96-summary.md
          git commit -m "Sprint 96 synchronize project state"
          git push origin HEAD:main
