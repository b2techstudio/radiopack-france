name: RadioPack CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: radiopack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: CSV and repository tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test CSV generator in isolated output
        run: python tests/test_generator.py

      - name: Test production files
        run: python tests/test_site_files.py

      - name: Test public pack registry
        run: python tests/test_pack_registry.py

      - name: Test regional pack research starter
        run: python tests/test_regional_pack_starter.py

      - name: Test paired RX policy
        run: python tests/test_paired_rx_policy.py

      - name: Test paired RX deduplicated memory plan
        run: python tests/test_paired_rx_memory_plan.py

      - name: Test Normandie v0.4 candidate delta
        run: python tests/test_normandie_v04_candidate_delta.py

      - name: Test Normandie v0.4 internal candidate
        run: python tests/test_normandie_v04_internal_candidate.py

      - name: Test Normandie v0.4 promotion gates
        run: python tests/test_normandie_v04_promotion_gates.py

      - name: Test Normandie v0.4 field and recovery tools
        run: python tests/test_normandie_v04_field_tools.py

      - name: Test Normandie v0.4 readiness and scenarios
        run: python tests/test_normandie_v04_readiness.py

      - name: Test Normandie v0.4 evidence pipeline
        run: python tests/test_normandie_v04_evidence_pipeline.py

      - name: Test Normandie v0.4 decision pipeline
        run: python tests/test_normandie_v04_decision_pipeline.py

      - name: Test Normandie v0.4 prepublication audit
        run: python tests/test_normandie_v04_prepublication_audit.py

      - name: Test Normandie v0.4 review handoff and drift guards
        run: python tests/test_normandie_v04_review_handoff.py

      - name: Test Sprint 60 guarded revalidation
        run: python tests/test_sprint60_revalidation.py

      - name: Test Sprint 61 guarded research
        run: python tests/test_sprint61_research.py

      - name: Test Sprint 62 primary reference boundaries
        run: python tests/test_sprint62_primary_reference_boundaries.py

      - name: Test Sprint 63 blocker source revalidation
        run: python tests/test_sprint63_blocker_revalidation.py

      - name: Test Sprint 64 dual RX contract
        run: python tests/test_sprint64_dual_rx_contract.py

      - name: Test Sprint 65 current primary recheck
        run: python tests/test_sprint65_primary_recheck.py

      - name: Test Sprint 66 technical inventory boundaries
        run: python tests/test_sprint66_technical_inventory_boundaries.py

      - name: Test Sprint 67 current reference synthesis
        run: python tests/test_sprint67_current_reference_synthesis.py

      - name: Test CROSS Etel network research
        run: python tests/test_etel_network_research.py

      - name: Test Bretagne REF analog expansion
        run: python tests/test_bretagne_ref_analog_expansion.py

      - name: Test analog coverage and redundancy review
        run: python tests/test_analog_coverage_redundancy_review.py

      - name: Test Bretagne research scaffold
        run: python tests/test_bretagne_research_scaffold.py

      - name: Test emergency and ADRASEC research
        run: python tests/test_emergency_relay_research.py

      - name: Test Mortain and Bretagne public radio research
        run: python tests/test_mortain_bretagne_radio_research.py

      - name: Test Annecy Alps Leman research inventories
        run: python tests/test_annecy_research.py

      - name: Test Annecy Alps Leman aviation and lakes research
        run: python tests/test_annecy_aviation_lakes.py

      - name: Test Annecy Alps Leman AIRAC 08 aviation
        run: python tests/test_annecy_airac08.py

      - name: Test Annecy Alps Leman internal candidate
        run: python tests/test_annecy_internal_candidate.py

      - name: Test Annecy Alps Leman release readiness
        run: python tests/test_annecy_release_readiness.py

      - name: Test Annecy Alps Leman local prepublication builder
        run: python tests/test_annecy_prepublication.py

      - name: Test Annecy Alps Leman reviewed CSV map
        run: python tests/test_annecy_prepublication_review.py

      - name: Test published web generator
        run: python tests/test_web_generator.py

  website:
    name: Astro production build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro website
        run: npm run build

      - name: Test built Annecy public CSV
        run: cd .. && python tests/test_built_annecy_public_csv.py

      - name: Test built public pack catalog
        run: cd .. && python tests/test_built_public_pack_catalog.py

  reference-archive:
    name: Build opt-in reference archive
    needs:
      - data
      - website
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[reference-archive]')) || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create exact source archive
        shell: bash
        run: git archive --format=zip --output="RadioPack-France-${GITHUB_SHA}.zip" HEAD

      - name: Upload reference archive
        uses: actions/upload-artifact@v4
        with:
          name: radiopack-reference-${{ github.sha }}
          path: RadioPack-France-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30

  report-status:
    name: Publish combined CI status
    needs:
      - data
      - website
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest

    steps:
      - name: Publish radiopack-ci/complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_RESULT: ${{ needs.data.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [[ "$DATA_RESULT" == "success" && "$WEBSITE_RESULT" == "success" ]]; then
            state="success"
            description="All RadioPack CI jobs passed"
          else
            state="failure"
            description="One or more RadioPack CI jobs failed"
          fi

          payload=$(jq -n \
            --arg state "$state" \
            --arg description "$description" \
            --arg context "radiopack-ci/complete" \
            --arg target_url "$RUN_URL" \
            '{
              state: $state,
              description: $description,
              context: $context,
              target_url: $target_url
            }')

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" \
            --data "$payload"

  # SPRINT67_FINALIZER_START
  sprint67-finalize:
    name: Finalize Sprint 67 changelog and HEAD
    if: ${{ github.event_name == 'push' && github.event.head_commit.message == 'Sprint 67 CI finalizer trigger' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Build exact final Sprint 67 commit
        env:
          ENTRY_B64: ""
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          old = changelog.read_text(encoding='utf-8')
          prefix = '# Changelog\n\n'
          assert old.startswith(prefix + '## 0.21.55 - 2026-08-11\n')
          assert '## 0.21.56 - 2026-08-11' not in old
          entry = base64.b64decode(os.environ['ENTRY_B64']).decode('utf-8')
          new = prefix + entry + old[len(prefix):]
          assert new.endswith(old[len(prefix):])
          changelog.write_text(new, encoding='utf-8')

          ci = Path('.github/workflows/ci.yml')
          text = ci.read_text(encoding='utf-8')
          start = '  # SPRINT67_FINALIZER_START\n'
          end = '  # SPRINT67_FINALIZER_END\n'
          assert start in text and end in text
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          ci.write_text(before.rstrip() + '\n' + after, encoding='utf-8')
          PY

          rm -f .github/workflows/sprint67-finalize.yml
          numstat="$(git diff --numstat -- CHANGELOG.md)"
          echo "$numstat"
          test "$numstat" = $'11\t0\tCHANGELOG.md'
          git diff --check
          git config user.name "b2techstudio"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/ci.yml .github/workflows/sprint67-finalize.yml
          git diff --cached --check
          git commit -m "Sprint 67 finalize current reference synthesis [reference-archive]"
          git push origin HEAD:main

      - name: Dispatch exact final-HEAD CI and archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            --data '{"ref":"main"}'
  # SPRINT67_FINALIZER_END
