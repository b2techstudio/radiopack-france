name: Annecy v0.3 Release Guards

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  annecy-v03:
    name: Annecy v0.3 immutable release guards
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Test Sprint 87 Annecy v0.3 prepublication
        run: python tests/test_sprint87_annecy_v03_prepublication.py

      - name: Test Annecy v0.3 public release
        run: python tests/test_annecy_v03_public_release.py
