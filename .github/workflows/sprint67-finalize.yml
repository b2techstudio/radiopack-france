name: Sprint 67 standalone changelog finalizer

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    if: ${{ github.event.head_commit.message == 'Sprint 67 standalone finalizer trigger' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main and prepend Sprint 67 changelog
        env:
          ENTRY_B64: ""
        shell: bash
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('CHANGELOG.md')
          old = path.read_text(encoding='utf-8')
          prefix = '# Changelog\n\n'
          assert old.startswith(prefix + '## 0.21.55 - 2026-08-11\n')
          assert '## 0.21.56 - 2026-08-11' not in old
          entry = base64.b64decode(os.environ['ENTRY_B64']).decode('utf-8')
          new = prefix + entry + old[len(prefix):]
          assert new.endswith(old[len(prefix):])
          path.write_text(new, encoding='utf-8')
          PY

          numstat="$(git diff --numstat -- CHANGELOG.md)"
          echo "$numstat"
          test "$numstat" = $'11\t0\tCHANGELOG.md'
          git diff --check
          git config user.name "b2techstudio"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --check
          git commit -m "Sprint 67 finalize current reference synthesis [reference-archive]"
          git push origin HEAD:main

      - name: Dispatch exact final-HEAD CI and archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            --data '{"ref":"main"}'
