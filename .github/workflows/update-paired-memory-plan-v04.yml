name: Update paired memory plan current-release assertion

on:
  push:
    branches:
      - annecy-v04-publication

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Keep historical plan independent from current registry version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_paired_rx_memory_plan.py')
          text = path.read_text(encoding='utf-8')
          old_comment = '# The current registry may nevertheless point to the separately reviewed immutable v0.3.'
          new_comment = '# The current registry may advance independently; the immutable v0.3 record is verified below.'
          if old_comment not in text:
              raise SystemExit('historical registry comment not found')
          text = text.replace(old_comment, new_comment, 1)
          old = 'assert \'version: "v0.3"\' in registry\n'
          if old not in text:
              raise SystemExit('obsolete current v0.3 registry assertion not found')
          text = text.replace(old, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit guard update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git add tests/test_paired_rx_memory_plan.py
          git commit -m "Keep paired memory plan historical after Annecy v0.4"
          git push origin HEAD:annecy-v04-publication
