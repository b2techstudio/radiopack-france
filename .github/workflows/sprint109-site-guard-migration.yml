name: Sprint 109 Site Guard Migration (ephemeral)

on:
  push:
    branches:
      - chore/sprint109-state-sync
    paths:
      - "tools/sync_sprint109_site_guard.py"
      - ".github/workflows/sprint109-site-guard-migration.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout state-sync branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: chore/sprint109-state-sync

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Apply site guard literal migration
        run: python tools/sync_sprint109_site_guard.py

      - name: Remove migration helpers and commit guard
        run: |
          rm tools/sync_sprint109_site_guard.py
          rm .github/workflows/sprint109-site-guard-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_site_files.py tools/sync_sprint109_site_guard.py .github/workflows/sprint109-site-guard-migration.yml
          git diff --cached --check
          git commit -m "Sprint 109: synchronize repository site guard"
          git push origin HEAD:chore/sprint109-state-sync
