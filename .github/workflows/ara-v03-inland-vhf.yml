name: Auvergne-Rhone-Alpes v0.3 Inland VHF

on:
  push:
    branches:
      - main
    paths:
      - "data/regional/auvergne-rhone-alpes-inland-vhf-rx.json"
      - "research/auvergne-rhone-alpes-v0.3/**"
      - "research/auvergne-rhone-alpes-v0.2/publication-record.json"
      - "tools/build_ara_v03_candidate.py"
      - "tests/test_ara_v03_candidate.py"
      - "tests/test_ara_v03_publication.py"
      - "website/src/lib/araPack.ts"
      - "website/src/lib/packRegistry.ts"
      - "website/src/data/regions.json"
      - "website/src/pages/regions/[slug].astro"
      - "website/src/pages/downloads/auvergne-rhone-alpes/radiopack-france-auvergne-rhone-alpes-v0.3.csv.ts"
      - ".github/workflows/ara-v03-inland-vhf.yml"
  pull_request:
    branches:
      - main
    paths:
      - "data/regional/auvergne-rhone-alpes-inland-vhf-rx.json"
      - "research/auvergne-rhone-alpes-v0.3/**"
      - "research/auvergne-rhone-alpes-v0.2/publication-record.json"
      - "tools/build_ara_v03_candidate.py"
      - "tests/test_ara_v03_candidate.py"
      - "tests/test_ara_v03_publication.py"
      - "website/src/lib/araPack.ts"
      - "website/src/lib/packRegistry.ts"
      - "website/src/data/regions.json"
      - "website/src/pages/regions/[slug].astro"
      - "website/src/pages/downloads/auvergne-rhone-alpes/radiopack-france-auvergne-rhone-alpes-v0.3.csv.ts"
      - ".github/workflows/ara-v03-inland-vhf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ara-v03-inland-vhf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication:
    name: ARA v0.3 publication invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: cd website && npm ci

      - name: Build Astro website and ARA v0.2/v0.3 routes
        run: cd website && npm run build

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build frozen ARA v0.3 candidate basis
        run: python tools/build_ara_v03_candidate.py --write

      - name: Rebuild and compare frozen ARA v0.3 candidate
        run: python tools/build_ara_v03_candidate.py --check

      - name: Test frozen ARA v0.3 inland-VHF candidate
        run: python tests/test_ara_v03_candidate.py --dist website/dist

      - name: Test ARA v0.3 public byte identity and publication invariants
        run: python tests/test_ara_v03_publication.py --dist website/dist
