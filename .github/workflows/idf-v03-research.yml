name: IDF v0.3 Research Guards

on:
  push:
    branches:
      - main
    paths:
      - "research/ile-de-france-v0.3/**"
      - "website/public/downloads/ile-de-france/**"
      - "website/src/lib/packRegistry.ts"
      - "website/src/pages/regions/[slug].astro"
      - "tools/build_idf_v03_candidate.py"
      - "tests/test_idf_v03_research.py"
      - "tests/test_idf_v03_candidate.py"
      - "tests/test_idf_v03_publication.py"
      - ".github/workflows/idf-v03-research.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/ile-de-france-v0.3/**"
      - "website/public/downloads/ile-de-france/**"
      - "website/src/lib/packRegistry.ts"
      - "website/src/pages/regions/[slug].astro"
      - "tools/build_idf_v03_candidate.py"
      - "tests/test_idf_v03_research.py"
      - "tests/test_idf_v03_candidate.py"
      - "tests/test_idf_v03_publication.py"
      - ".github/workflows/idf-v03-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-guard:
    name: Validate IDF v0.3 candidate and publication
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Test Île-de-France v0.3 research checkpoint
        run: python tests/test_idf_v03_research.py

      - name: Verify deterministic candidate and frozen SHA
        run: python tests/test_idf_v03_candidate.py

      - name: Verify immutable public IDF v0.3 CSV
        run: python tests/test_idf_v03_publication.py

      - name: Ensure public pack registry remains valid
        run: python tests/test_pack_registry.py

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: cd website && npm ci

      - name: Build Astro website
        run: cd website && npm run build

      - name: Verify Astro-built IDF v0.3 CSV and frozen SHA
        run: python tests/test_idf_v03_publication.py --dist website/dist
