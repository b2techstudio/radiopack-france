name: Patch Sprint 112 publication transition

on:
  push:
    branches:
      - release/normandie-v05-theoretical
    paths:
      - ".github/workflows/_patch_sprint112_publication_transition.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: release/normandie-v05-theoretical

      - name: Patch historical Sprint 112 tail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_sprint112_normandie_v05_theoretical.py')
          text = path.read_text(encoding='utf-8')
          old = '''assert PUBLIC_V04.is_file()\nassert not PUBLIC_V05.exists()\n\nprint("Sprint 112 Normandie v0.5: frozen theoretical candidate=146 RX, SHA stable, R3+F5ZHA promoted, F1ZOV/F6ZES deferred, no public v0.5 OK")\n'''
          new = '''assert PUBLIC_V04.is_file()\nif PUBLIC_V05.exists():\n    assert hashlib.sha256(PUBLIC_V05.read_bytes()).hexdigest() == EXPECTED_SHA\n    assert PUBLIC_V05.read_bytes() == module.candidate_csv_bytes(candidate)\n\nprint("Sprint 112 historical Normandie v0.5 guard: frozen theoretical candidate=146 RX and SHA remain stable before or after explicit publication OK")\n'''
          if old not in text:
              raise SystemExit('expected Sprint 112 tail not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/_patch_sprint112_publication_transition.yml

      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_sprint112_normandie_v05_theoretical.py .github/workflows/_patch_sprint112_publication_transition.yml
          git commit -m "Make Sprint 112 candidate guard historical-safe after publication"
          git push origin HEAD:release/normandie-v05-theoretical
