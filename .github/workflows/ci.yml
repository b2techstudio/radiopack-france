name: RadioPack CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: radiopack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: CSV and repository tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test CSV generator
        run: python tests/test_generator.py

      - name: Test production files
        run: python tests/test_site_files.py

      - name: Test Annecy Alps Leman research inventories
        run: python tests/test_annecy_research.py

  website:
    name: Astro production build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Astro website
        run: npm run build

  report-status:
    name: Publish combined CI status
    needs:
      - data
      - website
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Publish radiopack-ci/complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATA_RESULT: ${{ needs.data.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          if [[ "$DATA_RESULT" == "success" && "$WEBSITE_RESULT" == "success" ]]; then
            state="success"
            description="All RadioPack CI jobs passed"
          else
            state="failure"
            description="One or more RadioPack CI jobs failed"
          fi

          payload=$(jq -n \
            --arg state "$state" \
            --arg description "$description" \
            --arg context "radiopack-ci/complete" \
            --arg target_url "$RUN_URL" \
            '{
              state: $state,
              description: $description,
              context: $context,
              target_url: $target_url
            }')

          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" \
            --data "$payload"
