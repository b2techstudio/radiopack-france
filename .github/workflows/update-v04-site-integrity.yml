name: Update Annecy v0.4 Site Integrity Guard

on:
  push:
    branches:
      - annecy-v04-publication

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Update forward-compatible site integrity assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_site_files.py')
          text = path.read_text(encoding='utf-8')
          old = '    "Annecy–Alpes–Léman v0.3** — 76 mémoires RX",'
          new = '    "Annecy–Alpes–Léman v0.4** — 77 mémoires RX",'
          if old not in text:
              raise SystemExit('expected Annecy README assertion not found')
          text = text.replace(old, new, 1)
          anchor = '    "website/public/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.3-sans-aviation.csv",\n'
          additions = (
              '    "research/annecy-alpes-leman-v0.4/publication-record.json",\n'
              '    "tests/test_annecy_v04_public_release.py",\n'
              '    "website/public/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.4.csv",\n'
              '    "website/public/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.4-sans-aviation.csv",\n'
          )
          if additions not in text:
              if anchor not in text:
                  raise SystemExit('expected Annecy v0.3 file anchor not found')
              text = text.replace(anchor, anchor + additions, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit updated integrity guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git add tests/test_site_files.py
          git commit -m "Keep site integrity guard current with Annecy v0.4"
          git push origin HEAD:annecy-v04-publication
