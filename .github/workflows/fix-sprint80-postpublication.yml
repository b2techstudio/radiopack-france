name: Fix Sprint 80 post-publication metadata

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: ${{ contains(github.event.head_commit.message, '[fix-sprint80-postpublication]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Apply post-publication metadata fixes
        run: python tools/fix_sprint80_postpublication.py

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git checkout -- .github/workflows/ci.yml .github/workflows/fix-sprint80-postpublication.yml
          rm -f tools/fix_sprint80_postpublication.py research/.sprint80-postpublication-fix-trigger
          git add -A
          git commit -m "Sprint 80 align public metadata and historical guards"
          git push origin HEAD:main
