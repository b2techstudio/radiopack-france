name: Sprint 105 Materialize IDF v0.4

on:
  push:
    branches:
      - feature/sprint-105-idf-v04-inland-vhf

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/sprint-105-idf-v04-inland-vhf
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Build deterministic publication basis
        run: python tools/build_idf_v04_candidate.py --write
      - name: Materialize public CSV from candidate bytes
        run: |
          mkdir -p website/public/downloads/ile-de-france
          cp research/ile-de-france-v0.4/generated/release-candidate/radiopack-france-ile-de-france-v0.4-candidate.csv website/public/downloads/ile-de-france/radiopack-france-ile-de-france-v0.4.csv
      - name: Commit generated publication basis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ile-de-france-v0.4/generated/release-candidate website/public/downloads/ile-de-france/radiopack-france-ile-de-france-v0.4.csv
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Sprint 105: materialize IDF v0.4 publication basis"
            git push origin HEAD:feature/sprint-105-idf-v04-inland-vhf
          fi
