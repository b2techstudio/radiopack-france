name: Sprint 101 State Sync

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sprint101-state-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  state-sync:
    name: Official state 101 / 0.21.90
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Test Sprint 101 official state synchronization
        run: python tests/test_sprint101_state_sync.py
      - name: Test Île-de-France v0.3 research checkpoint
        run: python tests/test_idf_v03_research.py
