name: Normandie v0.5 Publication

on:
  pull_request:
    branches:
      - main
    paths:
      - "website/public/downloads/normandie/radiopack-france-normandie-v0.5.csv"
      - "website/src/lib/packRegistry.ts"
      - "website/src/data/regions.json"
      - "website/src/pages/regions/[slug].astro"
      - "research/normandie-v0.5/**"
      - "tools/build_normandie_v05_internal_candidate.py"
      - "tests/test_normandie_v05_public_release.py"
      - "tests/test_normandie_v04_public_release.py"
      - "tests/test_sprint84_normandie_v05_field_validation_kit.py"
      - "tests/test_sprint85_normandie_v05_field_evaluator.py"
      - ".github/workflows/normandie-v05-publication.yml"
  push:
    branches:
      - main
    paths:
      - "website/public/downloads/normandie/radiopack-france-normandie-v0.5.csv"
      - "website/src/lib/packRegistry.ts"
      - "website/src/data/regions.json"
      - "website/src/pages/regions/[slug].astro"
      - "research/normandie-v0.5/**"
      - "tools/build_normandie_v05_internal_candidate.py"
      - "tests/test_normandie_v05_public_release.py"
      - "tests/test_normandie_v04_public_release.py"
      - "tests/test_sprint84_normandie_v05_field_validation_kit.py"
      - "tests/test_sprint85_normandie_v05_field_evaluator.py"
      - ".github/workflows/normandie-v05-publication.yml"

permissions:
  contents: read

jobs:
  publication:
    name: Normandie v0.5 publication invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Verify frozen theoretical candidate
        run: python tests/test_sprint112_normandie_v05_theoretical.py

      - name: Verify immutable public v0.5
        run: python tests/test_normandie_v05_public_release.py

      - name: Verify historical v0.4 publication
        run: python tests/test_normandie_v04_public_release.py

      - name: Verify historical field kit remains optional tooling
        run: python tests/test_sprint84_normandie_v05_field_validation_kit.py

      - name: Verify historical field evaluator remains optional tooling
        run: python tests/test_sprint85_normandie_v05_field_evaluator.py

      - name: Build Astro production site
        working-directory: website
        run: |
          npm ci
          npm run build
