name: Sprint 98 Bootstrap

on:
  push:
    branches:
      - feature/sprint-98-metropolitan-consolidation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sprint98-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Apply Sprint 98 consolidation
        run: python tools/apply_sprint98_consolidation.py --dist website/dist

      - name: Commit generated consolidation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if git diff --quiet && [[ -z "$(git status --porcelain)" ]]; then
            echo "Sprint 98 consolidation already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md CHANGELOG.md research tests tools .github/workflows/ci.yml
          git commit -m "Consolidate Sprint 98 metropolitan v0.2 state"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
