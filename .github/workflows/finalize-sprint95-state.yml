name: Sprint 95 State Finalizer

on:
  push:
    branches:
      - annecy-v04-publication

permissions:
  contents: write

jobs:
  finalize-state:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Synchronize public metadata and project state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def replace_once(path, old, new):
              p = root / path
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Generator copy only; pack data comes from the public registry.
          replace_once(
              'website/src/pages/generateur.astro',
              'Annecy : sélectionne la variante complète 76 mémoires ou la variante 59 sans aviation.',
              'Annecy : sélectionne la variante complète 77 mémoires ou la variante 60 sans aviation.',
          )
          replace_once(
              'website/src/pages/generateur.astro',
              '<span class="badge badge-green">Annecy · 76 / 59</span>',
              '<span class="badge badge-green">Annecy · 77 / 60</span>',
          )

          # README current state.
          replace_once(
              'README.md',
              '**État courant : Sprint 92 / 0.21.81 — audit sécurité complet et durcissement fusionné ; dépendances auditées ; protections navigateur/CI automatisées ; DNS live radiopack.b2tech.studio non résolvable au contrôle externe.**',
              '**État courant : Sprint 95 / 0.21.84 — Annecy–Alpes–Léman v0.4 publiée et immuable à 77 RX / 60 sans aviation ; audit sécurité live Cloudflare Pages validé ; Bretagne v0.3 reste en attente AIRAC 09/26.**',
          )
          replace_once('README.md', '## État actuel — Sprint 92 / 0.21.81', '## État actuel — Sprint 95 / 0.21.84')
          replace_once(
              'README.md',
              '- **Annecy–Alpes–Léman v0.3** — 76 mémoires RX, variante 59 sans aviation, publiée et immuable ;',
              '- **Annecy–Alpes–Léman v0.4** — 77 mémoires RX, variante 60 sans aviation, publiée et immuable ;\n- Annecy–Alpes–Léman v0.3 — 76 / 59, historique immuable ;',
          )
          replace_once(
              'README.md',
              'Recherche : **Annecy v0.4 = 77 RX / 60 sans aviation, +1 RF**, candidat déterministe non public après validation du 50 MHz stock UV-K5/CHIRP. Normandie v0.5 reste à **142 RX**, delta 0 : R3/F5ZHA exigent du terrain, F1ZOV/F6ZES restent en veille source. Bretagne v0.3 reste à **151 RX**, delta 0, avec handoff AIRAC 09/26 préparé pour le 3 septembre 2026.',
              'Recherche active : Normandie v0.5 reste à **142 RX**, delta 0 : R3/F5ZHA exigent du terrain, F1ZOV/F6ZES restent en veille source. Bretagne v0.3 reste à **151 RX**, delta 0, avec handoff AIRAC 09/26 préparé pour le 3 septembre 2026. Annecy v0.4 est sortie du backlog : elle est désormais publique et immuable.',
          )
          replace_once(
              'README.md',
              '## Sprint 92 — audit et durcissement sécurité',
              '''## Sprint 95 — publication Annecy–Alpes–Léman v0.4

La **v0.4 est publiée et immuable à 77 RX / 60 sans aviation**. Elle ajoute uniquement `ZTH-6M` 50.5375 MHz à la v0.3, conserve 17 mémoires aviation, reste RX-only et préserve les CSV v0.3 octet pour octet. Empreintes et preuve : `research/annecy-alpes-leman-v0.4/publication-record.json`.

## Sprint 94 — prépublication Annecy–Alpes–Léman v0.4

Scope figé **77/60**, checklist **12/12**, zéro bloqueur. Le builder déterministe reconstruit les deux CSV avec les SHA attendus et la garde v0.4 vérifie la compatibilité stock UV-K5/CHIRP, les sources publiques et l'absence de RF privée ou inférée.

## Sprint 93 — clôture sécurité live

L'origine déployée `radiopack-france.pages.dev` est contrôlée en HTTPS par la CI : CSP, HSTS, anti-framing, `nosniff`, COOP, Referrer-Policy et Permissions-Policy sont vérifiés. Le domaine personnalisé `radiopack.b2tech.studio` reste suivi séparément tant que son DNS n'est pas publié.

## Sprint 92 — audit et durcissement sécurité''',
          )

          # PROJECT_STATUS current state.
          replace_once('PROJECT_STATUS.md', 'Sprint courant : **92**', 'Sprint courant : **95**')
          replace_once('PROJECT_STATUS.md', 'État logique : **0.21.81**', 'État logique : **0.21.84**')
          replace_once(
              'PROJECT_STATUS.md',
              'Résumé courant : `research/sprint-92-summary.md`. Audit détaillé : `research/security-audit-sprint92.md`.',
              'Résumé courant : `research/sprint-95-summary.md`. Audit détaillé : `research/security-audit-sprint92.md`.',
          )
          replace_once(
              'PROJECT_STATUS.md',
              '- Annecy–Alpes–Léman v0.3 : **76 mémoires RX**, variante **59 sans aviation**, publiée et immuable.',
              '- Annecy–Alpes–Léman v0.4 : **77 mémoires RX**, variante **60 sans aviation**, publiée et immuable.\n- Annecy–Alpes–Léman v0.3 : **76 / 59**, historique immuable.',
          )
          replace_once(
              'PROJECT_STATUS.md',
              '## Sprint 92 — audit de sécurité complet',
              '''## Sprint 95 — Annecy v0.4 publiée

Annecy–Alpes–Léman v0.4 est **publiée et immuable à 77 RX / 60 sans aviation**, +1 RF `ZTH-6M` 50.5375 MHz depuis v0.3. Les SHA publics sont figés dans `research/annecy-alpes-leman-v0.4/publication-record.json`; v0.3 reste inchangée.

## Sprint 94 — Annecy v0.4 prépublication

Scope figé **77/60**, revue **12/12**, bloqueurs **0**. Sources actuelles et compatibilité stock UV-K5/CHIRP validées ; builder et garde-fou déterministes ajoutés avant toute publication.

## Sprint 93 — sécurité live Cloudflare Pages

Le contrôle HTTP live vérifie désormais l'origine réellement déployée `radiopack-france.pages.dev` indépendamment du domaine personnalisé. CSP, HSTS, X-Frame-Options, nosniff, COOP, Referrer-Policy et Permissions-Policy sont tous contrôlés. `radiopack.b2tech.studio` reste un état DNS séparé.

## Sprint 92 — audit de sécurité complet''',
          )

          # CHANGELOG chronological entries.
          replace_once(
              'CHANGELOG.md',
              '## 0.21.81 - 2026-08-15',
              '''## 0.21.84 - 2026-08-15

- **Sprint 95** : publication immuable Annecy–Alpes–Léman v0.4 à **77 RX / 60 sans aviation**.
- Ajout unique `ZTH-6M` 50.5375 MHz ; RX-only, déduplication maintenue, v0.3 préservée octet pour octet.
- SHA-256 publics : `2557076fcb198b830cd3b5ba64d7ff894c8e0d6e90eafc0fa40b691a3c6a5d98` / `e31bfc6fce402af117b4f79caf6547b60a23c91ef36491e1351c74e96329aa6c`.

## 0.21.83 - 2026-08-15

- **Sprint 94** : prépublication Annecy v0.4 figée à **77/60**, revue **12/12**, zéro bloqueur, builder et garde-fou déterministes.

## 0.21.82 - 2026-08-15

- **Sprint 93** : vérification live du site Cloudflare Pages déployé ; en-têtes de sécurité HTTP validés. Le domaine personnalisé reste contrôlé séparément de l'origine Pages.

## 0.21.81 - 2026-08-15''',
          )

          # Machine-readable state: preserve all historical sections and only update current truth.
          state_path = root / 'research/project-resume-state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated'] = '2026-08-15'
          state['current_sprint'] = 95
          state['state_version'] = '0.21.84'
          annecy = state['public_packs']['annecy_alpes_leman']
          annecy.update({
              'version': '0.4',
              'memory_count': 77,
              'without_aviation_memory_count': 60,
              'immutable': True,
              'previous_immutable_version': '0.3',
              'previous_memory_count': 76,
              'previous_without_aviation_memory_count': 59,
              'publication_record': 'research/annecy-alpes-leman-v0.4/publication-record.json',
          })
          state['security_closeout'] = {
              'sprint': 93,
              'live_pages_origin_audited': True,
              'live_pages_origin': 'https://radiopack-france.pages.dev/',
              'custom_domain': 'radiopack.b2tech.studio',
              'custom_domain_dns_pending_on_2026_08_15': True,
              'main_branch_protection_enabled': False,
          }
          state['completed_annecy_v0_4_release'] = {
              'pack': 'Annecy–Alpes–Léman',
              'version': '0.4',
              'full_memory_count': 77,
              'without_aviation_memory_count': 60,
              'aviation_memory_count': 17,
              'new_unique_rf_memory_count': 1,
              'added_frequency_mhz': 50.5375,
              'full_sha256': '2557076fcb198b830cd3b5ba64d7ff894c8e0d6e90eafc0fa40b691a3c6a5d98',
              'without_aviation_sha256': 'e31bfc6fce402af117b4f79caf6547b60a23c91ef36491e1351c74e96329aa6c',
              'publication_record': 'research/annecy-alpes-leman-v0.4/publication-record.json',
              'immutable': True,
              'rx_only': True,
              'published_on': '2026-08-15',
          }
          additions = [
              'research/annecy-alpes-leman-v0.4/compatibility-and-source-review.json',
              'research/annecy-alpes-leman-v0.4/current-source-revalidation.json',
              'research/annecy-alpes-leman-v0.4/release-scope.json',
              'research/annecy-alpes-leman-v0.4/review-checklist.json',
              'research/annecy-alpes-leman-v0.4/prepublication-reviewed-memory-map.json',
              'research/annecy-alpes-leman-v0.4/publication-record.json',
              'research/sprint-93-summary.md',
              'research/sprint-94-summary.md',
              'research/sprint-95-summary.md',
          ]
          sources = state.setdefault('sources_of_truth', [])
          for item in additions:
              if item not in sources:
                  sources.append(item)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          summaries = {
              'research/sprint-93-summary.md': '''# Sprint 93 — clôture sécurité live\n\n- Date : 2026-08-15\n- L'origine Cloudflare Pages déployée `https://radiopack-france.pages.dev/` est auditée en HTTPS par la CI.\n- CSP, HSTS, X-Frame-Options, X-Content-Type-Options, COOP, Referrer-Policy et Permissions-Policy sont vérifiés.\n- `radiopack.b2tech.studio` reste contrôlé séparément ; son absence de DNS n'empêche plus de certifier l'origine Pages réellement déployée.\n- Les audits npm/Python, secrets, DOM-XSS, redirections, source maps et permissions Actions restent actifs.\n- La protection de branche `main` reste un réglage GitHub externe non activé dans l'état observé.\n''',
              'research/sprint-94-summary.md': '''# Sprint 94 — Annecy–Alpes–Léman v0.4 prépublication\n\n- Date : 2026-08-15\n- Scope figé : **77 RX / 60 sans aviation**, 17 aviation, delta **+1 RF** depuis v0.3.\n- Nouvelle RF : `ZTH-6M` **50.5375 MHz FM**, issue du REF courant.\n- Compatibilité stock : manuel UV-K5 50–600 MHz RX et pilote CHIRP UV-K5 `BANDS` 50–76 MHz ; aucun firmware modifié requis.\n- Checklist : **12/12**, bloqueurs : **0**.\n- SHA candidats : `2557076fcb198b830cd3b5ba64d7ff894c8e0d6e90eafc0fa40b691a3c6a5d98` / `e31bfc6fce402af117b4f79caf6547b60a23c91ef36491e1351c74e96329aa6c`.\n- Aucune fréquence ADRASEC non publiée n'est inférée.\n''',
              'research/sprint-95-summary.md': '''# Sprint 95 — Annecy–Alpes–Léman v0.4 publiée\n\n- Date : 2026-08-15\n- Statut : **publiée et immuable**.\n- Version complète : **77 RX** ; SHA-256 `2557076fcb198b830cd3b5ba64d7ff894c8e0d6e90eafc0fa40b691a3c6a5d98`.\n- Sans aviation : **60 RX** ; SHA-256 `e31bfc6fce402af117b4f79caf6547b60a23c91ef36491e1351c74e96329aa6c`.\n- Aviation : 17 ; delta depuis v0.3 : **+1 RF** (`ZTH-6M`, 50.5375 MHz).\n- v0.3 reste immuable : 76 / 59 et ses empreintes historiques sont contrôlées par les tests.\n- RX-only, Duplex=off, Offset=0.000000, déduplication RF, aucun remplissage artificiel, aucune RF privée/PPDR/ADRASEC non publiée.\n- Registre, page régionale, générateur et métadonnées publiques pointent vers v0.4.\n- Travail actif suivant : Bretagne v0.3, en attente de la revalidation AIRAC 09/26 à partir du 3 septembre 2026 ; Normandie v0.5 reste dépendante des validations terrain.\n''',
          }
          for name, content in summaries.items():
              (root / name).write_text(content, encoding='utf-8')
          PY
      - name: Commit synchronized state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git add README.md PROJECT_STATUS.md CHANGELOG.md research/project-resume-state.json website/src/pages/generateur.astro research/sprint-93-summary.md research/sprint-94-summary.md research/sprint-95-summary.md
          git commit -m "Sprint 95 synchronize publication state"
          git push origin HEAD:annecy-v04-publication
