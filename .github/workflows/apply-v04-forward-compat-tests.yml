name: Update historical guards for Annecy v0.4

on:
  push:
    branches:
      - annecy-v04-publication

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publication branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Update forward-compatible historical assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:100]!r}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Sprint 73: later Annecy releases may advance while Bretagne v0.1 stays immutable.
          replace_once(
              'tests/test_sprint73_bretagne_publication.py',
              '''assert annecy_public["version"] in {"0.2", "0.3"}\nassert annecy_public["memory_count"] in {65, 76}\nassert annecy_public["immutable"] is True\nif annecy_public["version"] == "0.3":\n    assert annecy_public["memory_count"] == 76\n    assert annecy_public["without_aviation_memory_count"] == 59\n    assert annecy_public["previous_immutable_version"] == "0.2"\n''',
              '''assert annecy_public["version"] in {"0.2", "0.3", "0.4"}\nassert annecy_public["memory_count"] in {65, 76, 77}\nassert annecy_public["immutable"] is True\nif annecy_public["version"] == "0.3":\n    assert annecy_public["memory_count"] == 76\n    assert annecy_public["without_aviation_memory_count"] == 59\n    assert annecy_public["previous_immutable_version"] == "0.2"\nelif annecy_public["version"] == "0.4":\n    assert annecy_public["memory_count"] == 77\n    assert annecy_public["without_aviation_memory_count"] == 60\n    assert annecy_public["previous_immutable_version"] == "0.3"\n    assert annecy_public["previous_memory_count"] == 76\n    assert annecy_public["previous_without_aviation_memory_count"] == 59\n''',
          )

          # Emergency and Mortain research tests verify v0.3 through its immutable record/static CSV,
          # not by requiring it to stay current in the public registry.
          replace_once(
              'tests/test_emergency_relay_research.py',
              '''assert 'version: "v0.4"' in registry\nassert 'version: "v0.3"' in registry\n''',
              '''assert 'version: "v0.4"' in registry\n''',
          )
          replace_once(
              'tests/test_mortain_bretagne_radio_research.py',
              '''assert annecy_record["rules"]["immutable"] is True\nassert 'version: "v0.3"' in registry\n''',
              '''assert annecy_record["rules"]["immutable"] is True\n''',
          )

          # Historical v0.2 readiness remains replayable while the current registry advances to v0.4.
          replace_once(
              'tests/test_annecy_release_readiness.py',
              '''# The current public registry now points to immutable v0.3, while the v0.2 route\n# above remains available as historical release evidence.\nregistry = PACK_REGISTRY.read_text(encoding="utf-8")\nassert 'id: "annecy-alpes-leman"' in registry\nassert 'version: "v0.3"' in registry\nassert 'memoryCount: 76' in registry\nassert 'memoryCount: 59' in registry\nassert '/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.3.csv' in registry\nassert '/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.3-sans-aviation.csv' in registry\n''',
              '''# The current public registry may advance independently from the historical v0.2/v0.3\n# evidence replayed by this test. Annecy v0.4 is the current immutable release.\nregistry = PACK_REGISTRY.read_text(encoding="utf-8")\nassert 'id: "annecy-alpes-leman"' in registry\nassert 'version: "v0.4"' in registry\nassert 'memoryCount: 77' in registry\nassert 'memoryCount: 60' in registry\nassert '/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.4.csv' in registry\nassert '/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.4-sans-aviation.csv' in registry\n''',
          )
          replace_once(
              'tests/test_annecy_release_readiness.py',
              'print("Tests Annecy–Alpes–Léman release readiness: PUBLISHED v0.2 + multi-region generator; historical readiness replayed and current immutable v0.3 76/59 recognized OK")',
              'print("Tests Annecy–Alpes–Léman release readiness: historical v0.2/v0.3 evidence replayed and current immutable v0.4 77/60 recognized OK")',
          )

          # Sprint 86 remains a v0.3 milestone; current public state can be v0.4.
          replace_once(
              'tests/test_sprint86_annecy_v03_paired_rx_expansion.py',
              '''public_annecy = state["public_packs"]["annecy_alpes_leman"]\nassert public_annecy["version"] == "0.3"\nassert public_annecy["memory_count"] == 76\nassert public_annecy["without_aviation_memory_count"] == 59\nassert public_annecy["immutable"] is True\n''',
              '''public_annecy = state["public_packs"]["annecy_alpes_leman"]\nassert public_annecy["version"] in {"0.3", "0.4"}\nassert public_annecy["immutable"] is True\nif public_annecy["version"] == "0.3":\n    assert public_annecy["memory_count"] == 76\n    assert public_annecy["without_aviation_memory_count"] == 59\nelse:\n    assert public_annecy["memory_count"] == 77\n    assert public_annecy["without_aviation_memory_count"] == 60\n    assert public_annecy["previous_immutable_version"] == "0.3"\n    assert public_annecy["previous_memory_count"] == 76\n    assert public_annecy["previous_without_aviation_memory_count"] == 59\n''',
          )
          replace_once(
              'tests/test_sprint86_annecy_v03_paired_rx_expansion.py',
              'assert "radiopack-france-annecy-alpes-leman-v0.3.csv" in registry',
              'assert "radiopack-france-annecy-alpes-leman-v0.4.csv" in registry',
          )

          # Public generator now presents the immutable v0.4 files; old v0.2 routes/library remain historical.
          replace_once('tests/test_web_generator.py', '    "Annecy · 76 / 59",', '    "Annecy · 77 / 60",')
          replace_once('tests/test_web_generator.py', "    'memoryCount: 76',", "    'memoryCount: 77',")
          replace_once('tests/test_web_generator.py', "    'memoryCount: 59',", "    'memoryCount: 60',")
          replace_once(
              'tests/test_web_generator.py',
              "    '/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.3.csv',",
              "    '/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.4.csv',",
          )
          replace_once(
              'tests/test_web_generator.py',
              "    '/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.3-sans-aviation.csv',",
              "    '/downloads/annecy-alpes-leman/radiopack-france-annecy-alpes-leman-v0.4-sans-aviation.csv',",
          )
          replace_once(
              'tests/test_web_generator.py',
              'print("Tests RadioPack Sprint 23 multi-region public generator: Bretagne v0.2 151 + Normandie 142 + Annecy v0.3 76/59 OK")',
              'print("Tests RadioPack Sprint 23 multi-region public generator: Bretagne v0.2 151 + Normandie 142 + Annecy v0.4 77/60 current, historical Annecy routes preserved OK")',
          )
          PY
      - name: Commit forward-compatible guards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "B2tech Studio"
          git config user.email "b2techstudio@gmail.com"
          git add tests/test_sprint73_bretagne_publication.py tests/test_emergency_relay_research.py tests/test_mortain_bretagne_radio_research.py tests/test_annecy_release_readiness.py tests/test_sprint86_annecy_v03_paired_rx_expansion.py tests/test_web_generator.py
          git commit -m "Keep historical guards valid after Annecy v0.4"
          git push origin HEAD:annecy-v04-publication
