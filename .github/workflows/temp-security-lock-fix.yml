name: Temporary security lock fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: security-audit-sprint92
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Remediate vulnerable transitive lock entry
        working-directory: website
        run: |
          npm ci
          npm audit fix --package-lock-only
          npm audit --audit-level=low

      - name: Commit only the repaired lockfile
        shell: bash
        run: |
          if git diff --quiet -- website/package-lock.json; then
            echo "No lockfile change produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/package-lock.json
          git commit -m "Sprint 92 remediate vulnerable npm lock entry"
          git push origin HEAD:security-audit-sprint92
