name: Temporary Sprint 92 finalizer

on:
  push:
    branches:
      - security-audit-sprint92-close

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout closing branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: security-audit-sprint92-close
          persist-credentials: true

      - name: Synchronize Sprint 92 docs and state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing expected text in {label}: {old!r}")
              return text.replace(old, new, 1)

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          readme = replace_once(
              readme,
              '**État courant : Sprint 91 / 0.21.80 — Annecy v0.4 candidat 77/60 non public ; Normandie v0.5 142/delta 0 bloquée terrain ; Bretagne v0.3 151/delta 0 en attente AIRAC 09/26.**',
              '**État courant : Sprint 92 / 0.21.81 — audit sécurité complet et durcissement fusionné ; dépendances auditées ; protections navigateur/CI automatisées ; DNS live radiopack.b2tech.studio non résolvable au contrôle externe.**',
              'README status',
          )
          readme = replace_once(readme, '## État actuel — Sprint 91 / 0.21.80', '## État actuel — Sprint 92 / 0.21.81', 'README heading')
          readme = readme.replace(
              '`research/sprint-91-summary.md`.',
              '`research/sprint-91-summary.md`, `research/sprint-92-summary.md` et `research/security-audit-sprint92.md`.',
              1,
          )
          sprint92_readme = '''## Sprint 92 — audit et durcissement sécurité\n\nAudit complet du site statique, des dépendances et de la chaîne CI/CD. Une alerte haute `nanoid 3.3.17` (`GHSA-2v37-7h3g-55p8`) a été corrigée vers `3.3.18`. `npm audit`, `pip-audit`, les 63 tests fonctionnels et le build Astro sont verts. CSP/HSTS et autres en-têtes de sécurité ont été ajoutés, les actions GitHub sont épinglées par SHA et le token CI est en moindre privilège. Le domaine `radiopack.b2tech.studio` ne résout pas depuis le runner public au moment du contrôle, donc l'audit HTTP live reste différé jusqu'à publication du DNS. Rapport : `research/security-audit-sprint92.md`.\n\n'''
          if '## Sprint 92 — audit et durcissement sécurité' not in readme:
              readme = replace_once(readme, '## Sprint 91 —', sprint92_readme + '## Sprint 91 —', 'README Sprint 92 insertion')
          readme_path.write_text(readme, encoding='utf-8')

          status_path = root / 'PROJECT_STATUS.md'
          status = status_path.read_text(encoding='utf-8')
          status = replace_once(status, 'Sprint courant : **91**', 'Sprint courant : **92**', 'PROJECT_STATUS sprint')
          status = replace_once(status, 'État logique : **0.21.80**', 'État logique : **0.21.81**', 'PROJECT_STATUS state')
          status = replace_once(status, 'Résumé courant : `research/sprint-91-summary.md`.', 'Résumé courant : `research/sprint-92-summary.md`. Audit détaillé : `research/security-audit-sprint92.md`.', 'PROJECT_STATUS resume')
          sprint92_status = '''## Sprint 92 — audit de sécurité complet\n\nLe dépôt et le site statique ont été audités et durcis. `nanoid 3.3.17` (alerte haute `GHSA-2v37-7h3g-55p8`) a été remplacé dans le lockfile par `3.3.18`. `npm audit --audit-level=low`, `pip-audit`, les invariants XSS/secrets/redirections, les **63 tests fonctionnels** et le build Astro passent. CSP, HSTS, COOP et autres en-têtes sont présents dans le build ; GitHub Actions utilise désormais des SHA immuables et des permissions réduites. Le contrôle HTTP externe a aussi établi que `radiopack.b2tech.studio` ne résout pas depuis GitHub Actions : aucun header live ne peut être certifié tant que le DNS n'est pas publié.\n\nRisques de configuration restant hors code : `main` non protégée, Dependabot vulnerability alerts désactivé, état Secret scanning / Code scanning non observable via l'intégration actuelle.\n\n'''
          if '## Sprint 92 — audit de sécurité complet' not in status:
              status = replace_once(status, '## Sprint 91 —', sprint92_status + '## Sprint 91 —', 'PROJECT_STATUS Sprint 92 insertion')
          status_path.write_text(status, encoding='utf-8')

          changelog_path = root / 'CHANGELOG.md'
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '''## 0.21.81 - 2026-08-15\n\n- **Sprint 92** : audit de sécurité complet du site Astro, des dépendances, des workflows GitHub Actions et des artefacts publics.\n- Correction de l'alerte haute `nanoid 3.3.17` / `GHSA-2v37-7h3g-55p8` vers `3.3.18`; `npm audit --audit-level=low` et `pip-audit` passent.\n- Ajout CSP/HSTS/COOP et durcissement JSON-LD, détection de sinks DOM-XSS/secrets/open redirects, vérification d'absence de source maps.\n- GitHub Actions épinglées par SHA, checkout sans credentials persistants, `statuses: write` limité au job de publication du statut.\n- Ajout d'un workflow Security Audit permanent et d'une configuration Dependabot hebdomadaire.\n- Test live : `radiopack.b2tech.studio` ne résout pas depuis un runner GitHub public ; contrôle des headers live différé tant que le DNS n'est pas publié.\n- Aucun CSV public ni contenu RF modifié.\n\n'''
          if '## 0.21.81 - 2026-08-15' not in changelog:
              changelog = replace_once(changelog, '# Changelog\n\n', '# Changelog\n\n' + entry, 'CHANGELOG insertion')
          changelog_path.write_text(changelog, encoding='utf-8')

          state_path = root / 'research/project-resume-state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          state['updated'] = '2026-08-15'
          state['current_sprint'] = 92
          state['state_version'] = '0.21.81'
          state['latest_sprint92_security_audit'] = {
              'status': 'security_audit_complete_build_hardened_live_dns_unresolved',
              'report': 'research/security-audit-sprint92.md',
              'summary': 'research/sprint-92-summary.md',
              'high_severity_dependency_findings': 1,
              'high_severity_dependency_findings_remediated': 1,
              'nanoid_previous_version': '3.3.17',
              'nanoid_remediated_version': '3.3.18',
              'nanoid_advisory': 'GHSA-2v37-7h3g-55p8',
              'npm_audit_passed': True,
              'pip_audit_passed': True,
              'security_invariants_passed': True,
              'functional_repository_tests_passed': 63,
              'astro_build_passed': True,
              'production_source_maps_found': False,
              'csp_configured': True,
              'hsts_configured': True,
              'github_actions_sha_pinned': True,
              'checkout_persist_credentials': False,
              'ci_global_write_permissions': False,
              'dependabot_version_updates_configured': True,
              'dependabot_vulnerability_alerts_repo_setting_enabled': False,
              'main_branch_protected': False,
              'secret_scanning_status': 'unconfirmed_connector_access_denied',
              'code_scanning_status': 'unconfirmed_connector_access_denied',
              'live_site_hostname': 'radiopack.b2tech.studio',
              'live_site_dns_resolved_from_github_actions': False,
              'live_http_security_headers_certified': False,
              'public_radio_pack_mutation': False,
          }
          sources = state.get('sources_of_truth')
          if isinstance(sources, list):
              for item in ['research/security-audit-sprint92.md', 'research/sprint-92-summary.md', '.github/workflows/security-audit.yml', 'tests/test_security_hardening.py']:
                  if item not in sources:
                      sources.append(item)
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          report_path = root / 'research/security-audit-sprint92.md'
          report = report_path.read_text(encoding='utf-8')
          report = report.replace(
              'État : audit technique pré-fusion terminé ; contrôle HTTP réel prévu automatiquement après fusion sur `main`.',
              'État : audit code/build terminé et fusionné ; contrôle HTTP réel tenté sur `main`, mais le nom `radiopack.b2tech.studio` ne résout pas depuis le runner GitHub public.',
              1,
          )
          post = '''\n## Vérification post-fusion sur `main`\n\nLe workflow Security Audit run 8 a confirmé sur le commit de fusion que les invariants repository, `pip-audit`, `npm audit`, le build Astro, l'absence de source maps et la présence de `_headers`/`_redirects` dans `dist` sont tous verts.\n\nLe job live a effectué **18 tentatives externes** et a obtenu à chaque fois `curl: (6) Could not resolve host: radiopack.b2tech.studio`. Il ne s'agit donc pas d'un échec CSP/HSTS : aucun serveur n'a été joint sous ce nom. Le workflow permanent est ajusté pour :\n\n- signaler un avertissement sans rendre le build rouge lorsque le DNS n'existe pas ;\n- devenir strict automatiquement dès que le nom résout ;\n- échouer si le site devient joignable mais ne renvoie pas CSP, HSTS, X-Frame-Options, nosniff, COOP, Referrer-Policy et Permissions-Policy attendus.\n\nLe déploiement/DNS du domaine reste ainsi visible comme **état non certifié**, sans créer un faux échec de sécurité du code.\n'''
          if '## Vérification post-fusion sur `main`' not in report:
              report += post
          report_path.write_text(report, encoding='utf-8')

          summary_path = root / 'research/sprint-92-summary.md'
          summary_path.write_text('''# Sprint 92 — audit et durcissement sécurité\n\nDate : 2026-08-15  \nÉtat logique : **0.21.81**\n\n## Résultat\n\n- audit du frontend statique Astro, des dépendances, des workflows GitHub Actions, des secrets à signal fort, des redirections/downloads et du build de production ;\n- alerte haute `nanoid 3.3.17` (`GHSA-2v37-7h3g-55p8`) corrigée vers `3.3.18` ;\n- `npm audit --audit-level=low` et `pip-audit` verts ;\n- 63 tests repository + build Astro verts ;\n- CSP/HSTS/COOP et autres headers configurés ; JSON-LD échappé contre fermeture de script ;\n- GitHub Actions épinglées par SHA, permissions réduites, checkout sans credentials persistants ;\n- surveillance Dependabot hebdomadaire ajoutée ;\n- domaine `radiopack.b2tech.studio` non résolvable depuis GitHub Actions lors du contrôle live, donc headers HTTP publics non certifiables à ce stade ;\n- aucune mutation des CSV publics ni des fréquences RF.\n\nRapport complet : `research/security-audit-sprint92.md`.\n\n## Réglages hors code restant à effectuer\n\n- protéger la branche `main` ;\n- activer Dependabot vulnerability alerts ;\n- vérifier/activer Secret scanning, Push protection et Code scanning si disponibles.\n''', encoding='utf-8')
          PY

      - name: Commit synchronized state
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md CHANGELOG.md research/project-resume-state.json research/security-audit-sprint92.md research/sprint-92-summary.md
          git diff --cached --check
          git commit -m "Sprint 92 synchronize security audit state"
          git push origin HEAD:security-audit-sprint92-close
